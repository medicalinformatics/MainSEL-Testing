name: SMPC-RL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull images
        run: docker compose -f compose.local.yaml pull

      - name: Run end-to-end test
        run: |
          docker compose -f compose.local.yaml up -d --no-build
          docker compose -f compose.local.yaml wait two-party-match-test

      - name: Collect report and logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f compose.local.yaml cp \
            two-party-match-test:/test-results/. test-results/ || true
          docker compose -f compose.local.yaml logs --no-color \
            > test-results/compose.log 2>&1 || true

      - name: Add result to job summary
        if: always()
        run: |
          report=test-results/smpc-rl-report.json
          if [ -f "$report" ]; then
            {
              echo '## SMPC-RL result'
              echo '```json'
              jq . "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smpc-rl-report
          path: test-results/

      - name: Stop stack
        if: always()
        run: docker compose -f compose.local.yaml down -v --remove-orphans
